<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Outer Bauhaus Canvas Tile -->
  <rect x="3" y="3" width="58" height="58" fill="#F8F6F0" stroke="#111317" stroke-width="4"/>

  <!-- Neo-Brutalist Hard Drop Shadows -->
  <circle cx="23" cy="23" r="11" fill="#111317"/>
  <rect x="35" y="12" width="20" height="20" fill="#111317"/>
  <rect x="12" y="38" width="42" height="16" fill="#111317"/>

  <!-- Geometric Color Blocks -->
  <!-- 1. Bauhaus Red Circle -->
  <circle cx="21" cy="21" r="11" fill="#E63946" stroke="#111317" stroke-width="3"/>

  <!-- 2. Bauhaus Golden Yellow Square -->
  <rect x="33" y="10" width="20" height="20" fill="#FFB703" stroke="#111317" stroke-width="3"/>

  <!-- 3. Bauhaus Ultramarine Blue Rectangle -->
  <rect x="10" y="36" width="42" height="16" fill="#1A56DB" stroke="#111317" stroke-width="3"/>
</svg>
